schema_version = 2

[board]
name = "oneplus13t"
soc = "SM8750"
soc_source = "sm8750"
os_profile = "ipados-17.7.11-21H461"
description = "OnePlus 13T PKX110: Stage 7 early userspace and CPU display"
kit = "oneplus13t"

[ipsw]
fetch = ["AppleLogo", "KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"applelogo@2732~ipad.im4p" = "de55e7b7a4eff459118f8a4ec9af79b017cfdbfec4c5b079346e414c68ff1fba"

[components]
# Adreno830 is the A830 kernel GPU driver (local source: local.toml or --local-module driver:Adreno830=../Adreno830).
# AdrenoMetal is selected from the start: the staged accelerator compiles against its OriginalAcceleratorABI.h; it is a
# payload-stage component and adds nothing to the kernel archives.
include = ["BootProgress", "NativeAES", "NativeKeyStoreEvents", "NativeMobileDisplay", "NativeRamBlock", "NativeUfs", "NativeVirtioBlock", "PaganiArmCpu", "PaganiArmDTPlatform", "PaganiDarwinBoot", "ShengPlatformPower", "Stage7Probe", "NativePrelink", "PaganiVerifiedRoot", "Sm8750Platform", "PaganiInput", "PaganiPanel", "QcomGeniSpi", "Adreno830", "AdrenoMetal", "PaganiAdsp", "PaganiAudio", "PaganiBattery", "PaganiHaptics", "PaganiSensors", "PaganiSpeaker", "PaganiWifi", "PaganiBt", "PaganiCamera", "PaganiTorch"]

[kernel]
config_fragments = ["arch:configs/common.config", "soc:configs/sm8750.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/pagani-series", "device:patches/xnu/series"]
defconfig = "oneplus13t_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  "component:PaganiArmCpu",
  "component:NativeAES",
  "component:NativeUfs",
  "build-ufs-storage-bindings.py --kernelcache ../../../../ipsw/21H461/kernelcache.decompressed",
  "component:NativeVirtioBlock",
  "component:NativeRamBlock",
  "component:ShengPlatformPower",
  "build-pagani-verified-root-probe.py --component os --include-systemos",
  "component:NativeMobileDisplay",
  # The A830 driver archive, then the board glue (PaganiGpuBoard, pagani_gpu_start) and the pinned gen80000 firmware
  # appended to it (scripts/build-pagani-gpu.py). The driver runs only with pagani-gpu=1 ([payload] kernel_args);
  # dropping that argument (--kernel-arg pagani-gpu=0) gives the CPU-composited image of before.
  "component:Adreno830",
  "build-pagani-gpu.py",
  # ADSP bring-up (pagani-adsp=1, default off) appended to the A830 archive, and the audio service (pagani-audio=1, default off;
  # its archive is force-loaded through CONFIG_XNU_EXTRA_LD_ARCHIVES in the defconfig).
  "component:PaganiAdsp",
  "component:PaganiAudio",
  # The battery power source (pagani-battery=1, or pagani-adsp=1 without pagani-battery; default off), appended to the A830
  # archive like PaganiAdsp, so no link setting changes; Stage7Probe calls pagani_battery_start after the GPU and ADSP starts.
  "component:PaganiBattery",
  # The vibrator (pagani-haptics=1; 2 dry run; default off), appended to the A830 archive the same way; Stage7Probe calls
  # pagani_haptics_start after the audio service.
  "component:PaganiHaptics",
  # The sensors (pagani-sensors=1 iOS services only, 2 the hub's lookups, 3 streams; 2 and 3 need pagani-adsp=1; default off),
  # appended to the A830 archive the same way (its HID class is qualified against the pinned kernelcache and registered late);
  # Stage7Probe calls pagani_sensors_start after the ADSP and haptics starts.
  "component:PaganiSensors",
  # The speakers (pagani-speaker=1; default off), appended to the A830 archive like the others; Stage7Probe calls
  # pagani_speaker_start after the audio service.
  "component:PaganiSpeaker",
  # The Wi-Fi (pagani-wifi=1..6, default off: 1 survey, 2 power, 3 link, 4 endpoint, 5 firmware + own MHI boot, 6 the Ath12kWifi
  # stack and the network service), appended to the A830 archive like the others; Stage7Probe calls pagani_wifi_start after the
  # battery and haptics starts. Its firmware is read in place (modem_a) or from the RAM Data seed, never put in the image.
  "component:PaganiWifi",
  # The Bluetooth (pagani-bt=N, default off: 1 power-up and handshake, 2 firmware and HCI, 3 LE scan self test), appended to the A830
  # archive like the others; Stage7Probe calls pagani_bt_start after the Wi-Fi. Its firmware is read in place from bluetooth_a and
  # modem_a, never put in the image.
  "component:PaganiBt",
  # The camera (pagani-cam=N, default off: 1 survey, 2 clock controllers read, 3 power domain and CCI version, 4 telephoto sensor ID), appended to the A830 archive
  # like the others; Stage7Probe calls pagani_camera_start after the Bluetooth.
  "component:PaganiCamera",
  # The torch (pagani-torch=1; 2 dry run; default off), appended to the A830 archive like the others; Stage7Probe calls pagani_torch_start
  # after the other starts. pagani-torch-ios=1 adds the iOS flashlight (phone-torch-overlay.patch, the plug-in in the Data seed).
  "component:PaganiTorch"
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.iokit.IOStorageFamily", "com.apple.filesystems.apfs",
  "com.apple.driver.AppleMobileFileIntegrity", "com.apple.kext.CoreTrust",
  "com.apple.security.sandbox", "com.apple.driver.ApplePMGR",
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.iokit.IOSurface", "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOHIDEventDriver",
  # IOAcceleratorES, the base of the staged AGXAccelerator: S9 loads it with OSKextLoadKextWithIdentifier
  # (ARCHITECTURE 3.3, 7.3); the 13T roots replace the OS profile's, so it must be listed here.
  "com.apple.iokit.IOGPUFamily",
]

[payload]
skip_setup_tool = "scripts/seed-data-skip-setup.py"
skip_setup_args = ["--no-auto-dim"]
volume = "UNIXNU13T"
# The Data seed carries the NativeAdrenoMetal plugin (about 22 MB) and Turnip (about 17 MB).
size_mib = 192
loader = "firmware"
title = "OnePlus 13T Stage 7: early userspace"
dram_size = "0x180000000"
timeout = 10
# GPU (Adreno830, M7-M9): pagani-gpu=1 runs the driver, sheng-gpu-addon=1 mounts the plugin seed, sheng-gpu-metal-opens=0
# lifts the per-process open limit, sheng-fb-gpu=1 hands the scanout copy to the GPU. Display: sheng-vsync only switches the
# refresh tick on; its rate is pagani-vsync (default 120, the AA594 panel's timing) and pagani-te=1 (M12) locks it to the TE.
# Sensors (PaganiSensors, default off): pagani-sensors=1 publishes the iOS sensor services only; with pagani-adsp=1, 2 also looks the
# sensors up on the ADSP's sensor hub and 3 streams what iOS asks for (pagani-sensors-axes, -als, -prox, -motion-hz, -log: README).
# Test loop (BootProgress RamoopsLog): pagani-ramoops=1 keeps the boot log in the Android ramoops region (read back from
# Android with gpu-test-loop); pagani-panic-reset=20 warm-resets 20 s after a panic screen (=0 halts as before). Loop images
# add --kernel-arg pagani-reset-after=<seconds>, which resets that long after boot whatever happens.
kernel_args = ["-v", "serial=0", "debug=0x14e", "cpus=8", "sheng-smp=1", "sheng-smp-gic=1", "armcpu-self-ipi=1", "kt_fixed_zones=240", "native-ufs-root=1", "native-ufs-diagnostics=1", "sheng-pmgr=2", "offline-apfs-load=1", "startup_debug=0", "-no_corpses", "sheng-vsync=120", "sheng-vsync-fixed=1", "offline-mobile-graphics-load=1", "offline-legacy-register=1", "offline-legacy-phase=4", "offline-legacy-gop=1", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "offline-key-events=1", "sheng-aks=1", "pagani-buttons=1", "pagani-touch=1", "pagani-panel=1", "pagani-gpu=1", "sheng-gpu-addon=1", "sheng-gpu-metal-opens=0", "sheng-fb-gpu=1", "pagani-ramoops=1", "pagani-panic-reset=20"]
trust_cache_sha256 = ["7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7"]

[payload.adt]
ipad_identity = true
unique_chip_id = "required"
chip_id = "0x8011"
packed_data_ramdisk = true
# 6 GiB window (DarwinBoot allows 256 MiB-8 GiB; the 13 GiB contiguous DDR at 0x8c0000000 holds it): hardware-tested
# 2026-10-30 with the A830 GPU desktop, matching dram_size above. 4 GiB left ~1.2 GB available under the GPU desktop.
# One image can take another window with 工具/make-a830-layout.sh's A830_OWNED_MEMORY; above 6 GiB the kernel needs phone-bootstrap-tables.patch.
owned_memory_size = "0x180000000"
# OS IOMedia UUID confirmed by the mode 12 hardware report.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"

[bootimg]
# This ABL loads init_boot's ramdisk even during fastboot boot.
embed_payload = true

# PKX110 512 GB: LUN 0 has 124186624 blocks and userdata ends at LBA 124186618
# (GPT read back on 2026-10-29). The 64 GiB unixnu window sits at the end of
# LUN 0, 1 MiB aligned. The 256 GB values (44928768..61705983) fall inside
# userdata on this phone. Confirm against partition.py plan before writing.
# The output filename remains userdata-root.img; deployment targets unixnu only.
[userdata]
partition = "unixnu"
first_lba = 107409152
last_lba = 124186367
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[firmware]
# Upstream Mu-Silicium plus the oneplus13t branch (oneplus13tPkg, BootShim
# payload handoff, SEC entry-argument HOBs). OnePlus13T.patch is the WARN-level
# DXE/BDS/PSCI trace from patches/mu-basecore-dxe-trace.patch, applied to
# Mu_Basecore for the build and reverted afterwards.
patches = ["Resources/MuPatches/OnePlus13T.patch"]
config = "oneplus13t"
dsc = "Platforms/OnePlus/oneplus13tPkg/oneplus13t.dsc"
fd = "Build/oneplus13tPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = [
  "Binaries",
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{tree}/package",
  "{tree}/drivers/PaganiDarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
]

[firmware.defines]
DEVICE_MODEL = "oneplus13t"
ENABLE_SECUREBOOT = "1"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "oneplus13t-512g-upstream-mu-20261029"

[device_tree]
source = "device:dts/oneplus13t.dts"
include_dirs = ["soc:dts"]

[adt.chosen.u32]
display-scale = 2
display-rotation = 0

[adt.defaults.u32]
sleep-disabled = 1

[adt.product.string]
model = "PKX110"

[adt.product.u32]
thin-bezel = 1

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2
# The Plus Key (gpio97, active low) is the ring/silent switch: PaganiInput reports it on the Telephony page (0x0B, 0x2E) as the
# switch state; MobileGestalt reads /buttons function-button_ringerab for the switch's presence (fix2/keys-review.md).
function-button_ringerab = 0
